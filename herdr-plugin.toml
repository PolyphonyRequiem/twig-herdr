id = "twig-herdr"
name = "Twig bench"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "Twig Tree/Table, semantic Bench configuration and digest-bound read-only Review. Includes a private native companion for browser/configuration v1, captured-origin/settings guards, type-specific unpinning and contents-guarded Bench lifecycle operations; normal Twig remains proposal authority. Close old hosts before upgrading, migrate workspaces only explicitly with Twig, and acknowledge/reconnect after actor or attachment changes. Installation never replaces normal Twig or migrates user data."
platforms = ["linux", "macos", "windows"]

[[build]]
platforms = ["linux", "macos"]
command = ["/bin/sh", "scripts/install.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/install.ps1"]

[[actions]]
id = "open"
platforms = ["linux", "macos"]
title = "Open Twig bench"
command = ["./bin/twig-herdr", "open"]

[[actions]]
id = "open-windows"
platforms = ["windows"]
title = "Open Twig bench"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", '''$p=$env:HERDR_PLUGIN_ROOT; if(-not $p){throw "HERDR_PLUGIN_ROOT is unset"}; if($p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path $p 'scripts\launch.ps1') open''']

[[actions]]
id = "table"
platforms = ["linux", "macos"]
title = "Twig bench: Table view"
command = ["./bin/twig-herdr", "table"]

[[actions]]
id = "table-windows"
platforms = ["windows"]
title = "Twig bench: Table view"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", '''$p=$env:HERDR_PLUGIN_ROOT; if(-not $p){throw "HERDR_PLUGIN_ROOT is unset"}; if($p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path $p 'scripts\launch.ps1') table''']

[[actions]]
id = "tree"
platforms = ["linux", "macos"]
title = "Twig bench: Tree view"
command = ["./bin/twig-herdr", "tree"]

[[actions]]
id = "tree-windows"
platforms = ["windows"]
title = "Twig bench: Tree view"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", '''$p=$env:HERDR_PLUGIN_ROOT; if(-not $p){throw "HERDR_PLUGIN_ROOT is unset"}; if($p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path $p 'scripts\launch.ps1') tree''']

[[actions]]
id = "exit-review"
platforms = ["linux", "macos"]
title = "Exit Twig review"
command = ["./bin/twig-herdr", "exit-review"]

[[actions]]
id = "exit-review-windows"
platforms = ["windows"]
title = "Exit Twig review"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", '''$p=$env:HERDR_PLUGIN_ROOT; if(-not $p){throw "HERDR_PLUGIN_ROOT is unset"}; if($p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path $p 'scripts\launch.ps1') exit-review''']

[[actions]]
id = "reconnect"
platforms = ["linux", "macos"]
title = "Twig bench: Acknowledge and reconnect"
command = ["./bin/twig-herdr", "reconnect"]

[[actions]]
id = "reconnect-windows"
platforms = ["windows"]
title = "Twig bench: Acknowledge and reconnect"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", '''$p=$env:HERDR_PLUGIN_ROOT; if(-not $p){throw "HERDR_PLUGIN_ROOT is unset"}; if($p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path $p 'scripts\launch.ps1') reconnect''']

[[panes]]
id = "bench"
platforms = ["linux", "macos"]
title = "Twig bench"
placement = "split"
command = ["./bin/twig-herdr", "panel"]

[[panes]]
id = "bench-windows"
platforms = ["windows"]
title = "Twig bench"
placement = "split"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", '''$p=$env:HERDR_PLUGIN_ROOT; if(-not $p){throw "HERDR_PLUGIN_ROOT is unset"}; if($p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path $p 'scripts\launch.ps1') panel''']
