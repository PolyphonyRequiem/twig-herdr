name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  TWIG_TELEMETRY_ENDPOINT: ""

jobs:
  build:
    name: build and verify ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-latest
            rid: win-x64
            goos: windows
            goarch: amd64
            ext: .exe
          - platform: linux-amd64
            runner: ubuntu-24.04
            rid: linux-x64
            goos: linux
            goarch: amd64
            ext: ""
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            rid: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - platform: macos-amd64
            runner: macos-15-intel
            rid: osx-x64
            goos: darwin
            goarch: amd64
            ext: ""
          - platform: macos-arm64
            runner: macos-15
            rid: osx-arm64
            goos: darwin
            goarch: arm64
            ext: ""
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify coordinated version and read frozen native pin
        id: release
        run: >-
          python scripts/release.py prepare
          --tag "$env:GITHUB_REF_NAME"
          --github-output "$env:GITHUB_OUTPUT"
          --github-env "$env:GITHUB_ENV"
      - name: Check out private companion source at exact commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.release.outputs.native_repository }}
          ref: ${{ steps.release.outputs.native_commit }}
          path: native-source
          # MinVer requires the source repository's real tags and history.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install tested companion SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.release.outputs.dotnet_sdk }}
      - name: Verify native source and SDK selection
        run: python scripts/release.py verify-native --source native-source
      - name: Go suite on target host
        run: go test ./...
      - name: Native browser, pin, lifecycle, sync and admission regressions
        working-directory: native-source
        run: >-
          dotnet test tests/Twig.Cli.Tests/Twig.Cli.Tests.csproj -c Release
          --filter 'FullyQualifiedName~WorkspaceCommandTests|FullyQualifiedName~BenchCommandTests|FullyQualifiedName~BenchConfigurationCommandTests|FullyQualifiedName~BenchSyncCommandTests|FullyQualifiedName~TrackingCommandTests|FullyQualifiedName~ConnectionBindingReadTests|FullyQualifiedName~PatConnectionBindingReadTests|FullyQualifiedName~ConnectionBindingTransitionConsumerTests'
          --logger 'trx;LogFileName=bench-cli.trx'
          --results-directory ../validation
      - name: Native Bench persistence, mutation and connection regressions
        working-directory: native-source
        run: >-
          dotnet test tests/Twig.Infrastructure.Tests/Twig.Infrastructure.Tests.csproj -c Release
          --filter 'FullyQualifiedName~Bench|FullyQualifiedName~Connection'
          --logger 'trx;LogFileName=bench-infrastructure.trx'
          --results-directory ../validation
      - name: Native membership and current Bench regressions
        working-directory: native-source
        run: >-
          dotnet test tests/Twig.Domain.Tests/Twig.Domain.Tests.csproj -c Release
          --filter 'FullyQualifiedName~Bench|FullyQualifiedName~WorkingSetFollowsCurrentBenchTests'
          --logger 'trx;LogFileName=bench-domain.trx'
          --results-directory ../validation
      - name: Build Herdr extension
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: >-
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.release.outputs.version }}"
          -o "build/frontends/twig-herdr${{ matrix.ext }}" .
      - name: Build standalone Bench TUI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: >-
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.release.outputs.version }}"
          -o "build/frontends/twig-bench-tui${{ matrix.ext }}" ./cmd/twig-bench-tui
      - name: Publish private native companion and SQLite dependency
        working-directory: native-source
        run: >-
          dotnet publish src/Twig/Twig.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishAot=true -p:PublishTrimmed=true -p:StripSymbols=true
          -o ../build/native
      - name: Smoke and package both complete portable bundles
        run: >-
          python scripts/release.py package
          --platform ${{ matrix.platform }}
          --version ${{ steps.release.outputs.version }}
          --frontend-dir build/frontends --native-dir build/native --output dist
      - name: Preserve native regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.platform }}
          path: validation/*.trx
          if-no-files-found: warn
      - name: Upload verified platform assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish complete coordinated release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify coordinated release version
        id: release
        run: python scripts/release.py prepare --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
      - name: Verify all platform assets and generate release-wide checksums
        run: >-
          python scripts/release.py assemble
          --version '${{ steps.release.outputs.version }}'
          --artifacts artifacts --output release
      - name: Upload draft, verify downloads, then publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/release.py publish
          --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY"
          --commit "$GITHUB_SHA" --directory release
