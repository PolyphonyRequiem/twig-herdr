name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Coordinated browser version
        required: true
        default: "0.3.0"
      publish:
        description: Publish only after signed-artifact verification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  TWIG_TELEMETRY_ENDPOINT: ""

jobs:
  build:
    name: build and verify ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-latest
            rid: win-x64
            goos: windows
            goarch: amd64
            ext: .exe
          - platform: linux-amd64
            runner: ubuntu-24.04
            rid: linux-x64
            goos: linux
            goarch: amd64
            ext: ""
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            rid: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - platform: macos-amd64
            runner: macos-15-intel
            rid: osx-x64
            goos: darwin
            goarch: amd64
            ext: ""
          - platform: macos-arm64
            runner: macos-15
            rid: osx-arm64
            goos: darwin
            goarch: arm64
            ext: ""
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify coordinated version and read frozen native pin
        id: release
        run: >-
          python scripts/release.py prepare
          --tag "${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}"
          --github-output "$env:GITHUB_OUTPUT"
          --github-env "$env:GITHUB_ENV"
      - name: Check out private companion source at exact commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.release.outputs.native_repository }}
          ref: ${{ steps.release.outputs.native_commit }}
          path: native-source
          # MinVer requires the source repository's real tags and history.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install tested companion SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.release.outputs.dotnet_sdk }}
      - name: Verify native source and SDK selection
        run: python scripts/release.py verify-native --source native-source
      - name: Require Windows signing configuration
        if: matrix.goos == 'windows'
        env:
          AZURE_SIGNING_CLIENT_ID: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          AZURE_SIGNING_TENANT_ID: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          AZURE_SIGNING_SUBSCRIPTION_ID: ${{ vars.AZURE_SIGNING_SUBSCRIPTION_ID }}
        run: |
          foreach ($name in @('AZURE_SIGNING_CLIENT_ID', 'AZURE_SIGNING_TENANT_ID', 'AZURE_SIGNING_SUBSCRIPTION_ID')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing required signing configuration: $name" }
          }
      - name: Azure login for existing Trusted Signing identity
        if: matrix.goos == 'windows'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SIGNING_SUBSCRIPTION_ID }}
      - name: Go suite on target host
        run: go test ./...
      - name: Build native release regression assemblies
        working-directory: native-source
        run: |
          foreach ($suite in @('Cli', 'Infrastructure', 'Domain')) {
            dotnet build "tests/Twig.$suite.Tests/Twig.$suite.Tests.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Native browser, Bench, binding and admission regressions
        run: python scripts/run-native-regressions.py --source native-source
      - name: Build Herdr extension
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: >-
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.release.outputs.version }}"
          -o "build/frontends/twig-herdr${{ matrix.ext }}" .
      - name: Build standalone Bench TUI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: >-
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.release.outputs.version }}"
          -o "build/frontends/twig-bench-tui${{ matrix.ext }}" ./cmd/twig-bench-tui
      - name: Publish private native companion and SQLite dependency
        working-directory: native-source
        run: |
          $linkerOptions = @()
          if ('${{ matrix.rid }}' -eq 'osx-x64') {
            # The preview SDK selects classic ld on Xcode 15/16; use Apple's current linker.
            $linkerOptions = @('-p:UseLdClassicXCodeLinker=false')
          }
          dotnet publish src/Twig/Twig.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:PublishTrimmed=true -p:StripSymbols=true -o ../build/native @linkerOptions
      - name: Sign both browsers and the private native companion
        if: matrix.goos == 'windows'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          endpoint: https://wus2.codesigning.azure.net/
          trusted-signing-account-name: polyphonyrequiem
          certificate-profile-name: public-trust
          files-folder: ${{ github.workspace }}/build
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify Windows publisher and timestamp before packaging
        if: matrix.goos == 'windows'
        run: >-
          pwsh -NoProfile -File scripts/verify-windows-signatures.ps1
          -FrontendDirectory build/frontends -NativeDirectory build/native
      - name: Smoke and package both complete portable bundles
        run: >-
          python scripts/release.py package
          --platform ${{ matrix.platform }}
          --version ${{ steps.release.outputs.version }}
          --frontend-dir build/frontends --native-dir build/native --output dist
      - name: Preserve native regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.platform }}
          path: |
            native-source/artifacts/test-logs/ci/
            native-source/artifacts/trace-311/
          if-no-files-found: warn
      - name: Upload verified platform assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish complete coordinated release
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify coordinated release version
        id: release
        run: python scripts/release.py prepare --tag "${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}" --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
      - name: Verify all platform assets and generate release-wide checksums
        run: >-
          python scripts/release.py assemble
          --version '${{ steps.release.outputs.version }}'
          --artifacts artifacts --output release
      - name: Upload draft, verify downloads, then publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/release.py publish
          --tag 'v${{ steps.release.outputs.version }}' --repository "$GITHUB_REPOSITORY"
          --commit "$GITHUB_SHA" --directory release
